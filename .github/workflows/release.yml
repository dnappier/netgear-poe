name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --locked
      - name: Build static Linux executable
        env:
          RUSTFLAGS: '-C linker=musl-gcc'
          CC: musl-gcc
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/package
          cp "target/$TARGET/release/netgear-poe" README.md LICENSE config.example.toml dist/package/
          tar -czf "dist/netgear-poe-$VERSION-$TARGET.tar.gz" -C dist/package .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish experimental release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$VERSION" *.tar.gz SHA256SUMS --verify-tag --prerelease --title "netgear-poe $VERSION (experimental)" --notes-file ../docs/release-notes.md
